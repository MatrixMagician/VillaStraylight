# CI gate for VillaStraylight.
#
# The supply-chain + CGO-free build gate:
#   - CGO_ENABLED=0 build proves the shipped binary stays a single static
#     artifact. This is load-bearing beyond tidiness: the villa-websafe unit
#     bind-mounts that binary into a distroless container with no libc, so a
#     dynamically-linked build fails to exec there.
#   - go vet + go test mirror `make check` (the pre-commit gate).
#   - gofmt asserts the tree is formatted. gofmt exits 0 whether or not it names
#     a file, so the gate reads the FILE LIST rather than the exit code.
#   - go mod verify is the Go-ecosystem supply-chain integrity gate (go.sum hashes
#     match the checksum DB) — stronger than registry-existence checking.
#   - govulncheck (pinned in .govulncheck-version, the same way golangci-lint is
#     pinned in .golangci-version) fails on a REACHABLE known vulnerability only
#     (its default): the binary is static and bind-mounted into villa-websafe and
#     every task VM, so a vulnerable stdlib or dependency symbol ships everywhere
#     that pulls in this build.
#   - the TUI-stack grep asserts the guided install stays on the standard library.
#     It replaces a narrower bubbletea-v1 pin that existed only to stop huh
#     dragging in a second major version; with the whole stack gone, the honest
#     assertion is that none of it comes back.
name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # PINNED rather than `ubuntu-latest`, and pinned to 26.04 specifically
    # because that is what `ubuntu-latest` ALREADY resolved to here (verified in
    # the run logs: "Image: ubuntu-26.04"), so this preserves the image CI is
    # green on instead of changing it. Pinning to 24.04 would have been a
    # downgrade onto an image this tree has never built on.
    #
    # WHY PIN AT ALL. actions/runner-images#14748 migrates `ubuntu-latest` to
    # Ubuntu 26.04 over several weeks from 2026-10-19, completing 2026-11-19.
    # Mid-rollout the label is non-deterministic: two runs of the same commit
    # can land on different images, so a failure caused by the image is hard to
    # tell from a failure caused by the change under test. A pin makes the OS a
    # declared input, which matters most for the sandbox-image job below, whose
    # `podman build` resolves pinned Fedora NEVRs.
    #
    # THE COST, stated so it is not a surprise: a pin does not expire, so this
    # label must be bumped deliberately when 26.04 nears end of support. That is
    # the trade accepted here — a scheduled bump beats a surprise migration.
    #
    # NOTE for anyone running actionlint locally: versions up to at least
    # v1.7.12 do not know the `ubuntu-26.04` label yet and report it as
    # unknown. That is a stale tool, not a broken workflow — actions/runner-images
    # lists `ubuntu-26.04` as a supported x64 label, and CI runs on it here.
    # Do not "fix" this by reverting to `ubuntu-latest`.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # go-version-file reads go.mod's `go` directive, which is the SINGLE place
      # the toolchain pin lives — the same discipline .golangci-version and
      # .govulncheck-version use for their tools. Hardcoding a version here was
      # a second copy that could silently disagree with the module, and a CI
      # toolchain older than the directive fails the build for a reason that has
      # nothing to do with the change under test.
      #
      # v6 of this action sets GOTOOLCHAIN=local (actions/setup-go#460), which
      # stops `go` fetching a toolchain to satisfy a directive. That is SAFE
      # here only because go-version-file installs the directive's own version,
      # so the installed toolchain already satisfies go.mod. The pairing is
      # load-bearing: pinning a go-version BELOW the directive, or adding a
      # `toolchain` directive newer than the installed version, would fail with
      # "go.mod requires go >= X (running Y; GOTOOLCHAIN=local)" instead of
      # silently upgrading. That failure was reproduced locally before this
      # bump landed, against `make lint`, `make govulncheck` and the build.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: CGO-free static build (SC#4 gate)
        run: CGO_ENABLED=0 go build ./...

      # gofmt was the one tool in DEVELOPMENT.md's Code style table with no gate
      # behind it: `make check` said so about itself, so an unformatted file
      # reached main unless a reviewer noticed by eye. gofmt exits 0 whether or
      # not it printed names, so the FILE LIST is what decides here, not the
      # exit code. `make fmt-check` is the same check, so local and CI agree.
      - name: gofmt (formatting gate)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean. Run \`make fmt\`:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet + test (mirrors `make check`)
        run: go vet ./... && go test ./...

      # Race-detector gate (CR-01 / WR-04): internal/websafe is the only
      # intentionally-concurrent pure core (Loader.Load fans out fetch
      # goroutines), so a data race there can silently corrupt normalization and
      # let an injection slip the classifier. The race detector is cgo-based, so
      # this step enables CGO for the TEST run only — the shipped binary stays
      # CGO-free (the CGO-free build gate above is unchanged).
      - name: race gate (CR-01 — concurrency invariant)
        run: CGO_ENABLED=1 go test -race ./...

      - name: go mod verify (supply-chain integrity)
        run: go mod verify

      # The pin lives in .govulncheck-version and nowhere else; `make govulncheck`
      # reads the same file, so local and CI cannot disagree about which scanner
      # ran. Fails only on a REACHABLE vulnerability (govulncheck's default).
      - name: resolve the pinned govulncheck version
        id: vulnver
        run: echo "version=$(cat .govulncheck-version)" >> "$GITHUB_OUTPUT"

      - name: govulncheck (reachable known vulnerabilities)
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ steps.vulnver.outputs.version }} ./...

      # The repo carried a .golangci.yml that no CI step ever ran, and `make
      # lint` silently falls back to `go vet` when the binary is absent — so the
      # config sat unloadable (v1 format under a v2 binary) without anything
      # noticing. It runs here now so that cannot recur.
      #
      # only-new-issues gates the DIFF rather than the tree: there is a standing
      # backlog of pre-existing findings, and failing every PR on those would
      # train contributors to ignore the linter. New code is held to the config;
      # the backlog is a separate, deliberate cleanup.
      #
      # v8 of the action was the first that defaults to a golangci-lint v2
      # binary; v6 pinned a v1.6x build compiled with go1.24, which refuses a
      # module targeting go1.26.10 ("the Go language version used to build
      # golangci-lint is lower than the targeted Go version"). v9 keeps the v2
      # default and moves the action's own runtime to Node 24; it still accepts
      # the `version` and `only-new-issues` inputs this step depends on. The
      # action is pinned to a major rather than floating on `latest` so a future
      # release cannot silently reintroduce that mismatch.
      #
      # pull_request only. On a push event there is no base to diff against, so
      # only-new-issues degenerates to "all issues" and the step fails on the
      # standing backlog — which is precisely the noise this gate is shaped to
      # avoid. The workflow triggers on both events, so the condition is what
      # keeps the lint step meaningful rather than the trigger list.
      # The pin lives in .golangci-version and nowhere else. `make lint` reads the
      # same file and runs that exact version via `go run`, so a contributor's
      # distro package cannot disagree with CI about what is clean. Bumping the
      # linter is a one-line change to that file.
      - name: resolve the pinned golangci-lint version
        id: lintver
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"

      - name: lint (new issues only)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.lintver.outputs.version }}
          only-new-issues: true

      - name: assert the guided install stays on the standard library
        run: |
          if grep -qE 'charmbracelet|muesli/termenv' go.mod; then
            echo "A TUI dependency reappeared in go.mod:"
            grep -nE 'charmbracelet|muesli/termenv' go.mod
            echo
            echo "The guided install is a stdin prompt loop over the standard"
            echo "library (see cmd/villa/install_wizard.go). If a full-screen UI"
            echo "is genuinely wanted again, that is a decision to make"
            echo "deliberately rather than by adding an import."
            exit 1
          fi

  # The sandbox image is the one pin villa BUILDS rather than pulls, so nothing
  # upstream proves it still builds. This job does, and only that: it never
  # pushes, and the digest it produces is discarded.
  #
  # A dnf build is not byte-reproducible, so this digest will not equal the one
  # in internal/orchestrate/sandbox.go and comparing them would fail every run
  # for no reason. What the job proves is narrower and is the thing that actually
  # rots: that the pinned NEVRs and the pinned wheel hashes are still resolvable,
  # and that the layers still assemble. A Fedora rebase that retires
  # python3-openpyxl-3.1.5-5.fc44 fails here loudly instead of on an operator's
  # first `villa work`.
  #
  # It does NOT run the image. krun needs /dev/kvm, which a GitHub runner does
  # not have, so the microVM half of the proof stays in the on-hardware suite.
  # The tools are still checked, under the default runtime, because "the packages
  # landed" is answerable without a VM.
  sandbox-image:
    # Pinned for the reason given on build-and-test above, and this is the job
    # that reason is really about: the `podman build` below resolves pinned
    # Fedora NEVRs and wheel hashes, so the host image is a real input to
    # whether the layers assemble. 26.04 is where this job is already green.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: build the sandbox image (never pushed)
        run: podman build -t localhost/villa-sandbox:office -f build/sandbox/Containerfile build/sandbox

      - name: the office tools are present
        run: |
          podman run --rm --network none localhost/villa-sandbox:office sh -c '
            set -e
            soffice --version
            python3 -c "import docx, openpyxl"
            which which
            pdftoppm -v
          '
