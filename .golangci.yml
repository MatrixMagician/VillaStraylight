# golangci-lint configuration.
#
# This file was v1-format and therefore silently unloadable by golangci-lint v2:
# `golangci-lint run` failed with "unsupported version of the configuration"
# rather than linting anything. Since `make lint` falls back to `go vet` when the
# binary is absent, and CI never ran the linter at all, nothing surfaced that.
# Migrated with `golangci-lint migrate`, and CI now runs it so the config cannot
# rot unnoticed again.
#
# errcheck/govet/ineffassign/staticcheck/unused are enabled by default in v2 and
# no longer need listing; misspell and revive are the additions. errcheck stays
# excluded for _test.go, as before: a test that ignores a cleanup error is noise,
# not a finding.
version: "2"
linters:
  enable:
    - misspell
    - revive
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      # revive's unused-parameter is a false positive by construction in tests.
      # The fakes here implement fixed Deps-seam signatures, so an unused
      # parameter cannot be dropped, and its name is the only place the seam's
      # contract is legible at the call site. Renaming ~24 of them to `_` would
      # cost real information to satisfy a check that cannot apply here.
      - linters:
          - revive
        path: _test\.go
        text: unused-parameter
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  # Report every occurrence, not a sample. golangci-lint defaults to
  # max-same-issues: 3 and max-issues-per-linter: 50, which showed this tree 67
  # findings when it had 171. Anyone triaging a cleanup off that number plans
  # against a backlog that is not the real one, and a repeated finding looks
  # fixed after three edits. A count that is not the count is worse than no
  # count.
  max-same-issues: 0
  max-issues-per-linter: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
